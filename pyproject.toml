[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cca-lefebvre"
version = "0.1.0"
description = "Native point-cloud review, alignment and architectural projection tools"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "Creative Computational Architecture - Caglar Celik Architects (CCA)"}]
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.11,<2", "pandas>=2.2,<4", "pyarrow>=15,<26",
  "opencv-contrib-python>=4.9,<6", "imageio>=2.34,<3", "OpenEXR>=3.2,<4",
  "open3d>=0.18,<0.20", "ezdxf>=1.2,<2", "PySide6>=6.8,<7",
  "pyvista>=0.46,<0.47", "pyvistaqt>=0.11,<0.12", "vtk>=9.4,<10",
  "pye57>=0.4,<0.5", "psutil>=6,<8", "Pillow>=10,<13",
  "matplotlib>=3.8,<4", "reportlab>=4.1,<6"
]

[project.optional-dependencies]
control = ["mcp>=2.2,<3"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
cca-lefebvre = "viewer.desktop_app:main"

[project.urls]
Homepage = "https://caglarcelik.works"
Repository = "https://github.com/creative-computational-architecture/cca-lefebvre"

[tool.setuptools.packages.find]
include = ["viewer*", "geometry*", "field*", "export*", "ingest*"]

[tool.setuptools.package-data]
viewer = ["assets/icons/*.svg", "assets/brand/v3/*.svg", "assets/brand/v3/*.json"]
export = ["*.ps1", "*.cmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
